# --- Amateur HF with location (same RX888, extra USB channels) ---
# 6 m is above 64.8 Msps Nyquist (32.4 MHz). 10 m is the top band.
[FT8]
data = ft8.local
samprate = 12k
encoding = s16be
mode = usb
hang-time = 0
recovery-rate = 60
low = 100
high = 3k
freq = "1840k 3573k 5357k 7074k 10136k 14074k 18100k 21074k 24915k 28074k"
buffer = 2
agc = yes

