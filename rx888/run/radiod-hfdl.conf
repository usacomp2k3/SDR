# WP-KMCO RX888mk2 — all HFDL bands simultaneously
# 64.8 Msps direct sampling covers 0–32.4 MHz (every HFDL channel).

[global]
hardware = rx888
status = hfdl-status.local
data = hfdl.local
preset = iq
ttl = 0
iface = lo
verbose = 1
fft-threads = 4
# blocktime default is 0.02 s (20 ms). Do NOT set 20 — current ka9q treats that as 20 seconds.

[rx888]
device = rx888
description = WP-KMCO-HFDL RX888mk2 MLA30+
samprate = 64m8
reference = 27m
gainmode = low
reqsize = 32
# firmware already RAM-loaded by udev; leave empty so we don't touch 00f3

# One wide IQ channel per HF aero band (Phil Karn / start-hfdl centers).
# Plus Reykjavik 3900 kHz, which sits outside the 3477 kHz 50 kHz slice.
dither = yes
queuedepth = 16

[HFDL21]
data = hfdl.local
encoding = s16be
samprate = 80k
mode = iq
low = -36k
high = +36k
hang-time = 0
recovery-rate = 100
freq = 21964k
buffer = 3
agc = yes
