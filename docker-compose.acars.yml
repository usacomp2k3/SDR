# Legacy USB acarsdec — parked. Live VHF ACARS is host ka9q + acarsdec
# (vhf-r2-radiod / vhf-r2-decode). Do not start without --profile legacy-usb
# or it will steal Mini *234f from irdm.

services:
  acarsdec:
    image: ghcr.io/sdr-enthusiasts/docker-acarsdec:latest
    container_name: acarsdec
    profiles: ["legacy-usb"]
    restart: "no"
    depends_on:
      - acars_router
    environment:
      - TZ=${TZ:-America/New_York}
      - QUIET_LOGS=false
      - RTL_SERIAL=${ACARS_RTL_SERIAL:-}
      - AIRSPY_SERIAL=${ACARS_AIRSPY_SERIAL:-}
      - SOAPYSDR=${ACARS_SOAPYSDR:-}
      # Airspy: linearity 0–21 (no AGC). RTL: -10 or >52 = AGC.
      - GAIN=${ACARS_GAIN:--10}
      - PPM=0
      # External bias injectors — never enable dongle bias-T
      - BIASTEE=false
      - FREQUENCIES=${ACARS_FREQUENCIES:-130.025 130.450 131.125 131.550 131.725}
      - FEED_ID=${STATION_ID:-WP-KMCO}-ACARS
      - OUTPUT_SERVER=acars_router
      - OUTPUT_SERVER_PORT=5550
      - OUTPUT_SERVER_MODE=udp
    tmpfs:
      - /run:exec,size=512M
      - /var/log:size=512M
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /dev/bus/usb:/dev/bus/usb:ro
      - /dev:/dev:ro
      # Unpack VHF FANS (ADS-C / CPDLC) before acars_router.
      - ./acars/libacars-enrich.py:/opt/libacars-enrich.py:ro
      - ./acars/acars_bridge:/etc/s6-overlay/scripts/acars_bridge:ro
