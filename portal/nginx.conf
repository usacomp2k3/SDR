server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggregator + SDR status API (host network service on 8881)
    location /api/status {
        proxy_pass http://host.docker.internal:8881/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
    }

    location /api/sdr {
        proxy_pass http://host.docker.internal:8881/api/sdr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
    }

    # Unified coverage map API (host network service on 8882)
    location /api/map/ {
        proxy_pass http://host.docker.internal:8882/api/map/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
    }

    location = /atc-stats.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
