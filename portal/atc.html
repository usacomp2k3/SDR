<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WP-KMCO VHF ATC</title>
  <style>
    :root {
      --bg: #0b1220; --card: #141e30; --border: #243049;
      --text: #e8eef8; --muted: #8b9bb8; --accent: #3d9cf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem 1.1rem 3rem; }
    a { color: var(--accent); }
    h1 { margin: 0 0 .3rem; font-size: 1.45rem; }
    .sub { color: var(--muted); margin-bottom: 1.1rem; font-size: .92rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .7rem; margin-bottom: 1.1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: .85rem 1rem; }
    .card h2 { margin: 0 0 .35rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .card .n { font-size: 1.6rem; font-weight: 650; }
    .card .s { font-size: .8rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .4rem .45rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; }
    .mono { font-family: ui-monospace, monospace; }
    .bar { height: .45rem; background: #1a2740; border-radius: 99px; overflow: hidden; min-width: 4rem; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .err { color: #f0b429; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>VHF ATC transmissions</h1>
    <p class="sub">
      R2 VHF mux · 25 kHz raster 128.625–137.375 · squelch-open counts · refresh 30s ·
      <a href="/">portal</a> ·
      <a href="http://127.0.0.1:8080/">ACARS Hub</a>
    </p>
    <div class="cards" id="cards"></div>
    <p id="meta" class="sub">Loading…</p>
    <table>
      <thead>
        <tr>
          <th>Channel</th>
          <th>MHz</th>
          <th>TX</th>
          <th>Last hour</th>
          <th>Talk</th>
          <th>Last</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7" class="sub">Waiting for atc-stats.json…</td></tr></tbody>
    </table>
  </div>
  <script>
    function ago(iso) {
      if (!iso) return "—";
      const s = Math.max(0, (Date.now() - Date.parse(iso + (iso.endsWith("Z") ? "" : "Z"))) / 1000);
      if (s < 90) return Math.round(s) + "s ago";
      if (s < 3600) return Math.round(s / 60) + "m ago";
      return Math.round(s / 3600) + "h ago";
    }
    function talk(sec) {
      if (!sec) return "—";
      if (sec < 90) return Math.round(sec) + "s";
      return (sec / 60).toFixed(1) + "m";
    }
    function sinceLabel(iso) {
      if (!iso) return "lifetime";
      return "since " + iso.replace("T", " ").replace("Z", " UTC");
    }
    async function load() {
      const meta = document.getElementById("meta");
      const tb = document.getElementById("rows");
      const cards = document.getElementById("cards");
      try {
        const r = await fetch("/atc-stats.json", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        const ch = d.channels || [];
        const shown = ch.filter((c) => (c.tx || 0) > 0);
        const maxTx = Math.max(1, ...shown.map((c) => c.tx || 0));
        cards.innerHTML = [
          ["Total TX", d.tx_total ?? 0, sinceLabel(d.since)],
          ["Last hour", d.tx_1h ?? ch.reduce((n, c) => n + (c.tx_1h || 0), 0), "all channels"],
        ].map(([h, n, s]) => `<div class="card"><h2>${h}</h2><div class="n">${n}</div><div class="s">${s}</div></div>`).join("");
        const hidden = ch.length - shown.length;
        meta.textContent = "Updated " + (d.updated || "—") + " · showing TX > 0 (" + shown.length + " of " + ch.length + (hidden ? ", " + hidden + " idle hidden" : "") + ") · " + (d.note || "");
        if (!shown.length) {
          tb.innerHTML = `<tr><td colspan="7" class="sub">No transmissions yet (zeros stay in SQLite, hidden here).</td></tr>`;
          return;
        }
        tb.innerHTML = shown.map((c) => `<tr>
          <td>${c.name || ""}</td>
          <td class="mono">${(c.freq_mhz || 0).toFixed(3)}</td>
          <td class="mono">${c.tx ?? 0}</td>
          <td class="mono">${c.tx_1h ?? 0}</td>
          <td class="mono">${talk(c.talk_s)}</td>
          <td>${ago(c.last)}</td>
          <td><div class="bar"><span style="width:${Math.round(100 * (c.tx || 0) / maxTx)}%"></span></div></td>
        </tr>`).join("");
      } catch (e) {
        meta.innerHTML = `<span class="err">No stats yet (${e.message}).</span>`;
      }
    }
    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
