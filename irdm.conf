# Iridium — Airspy Mini *234f (6 MS/s). R2 is the VHF mux.
# Mini window ~1619–1625 MHz (not full 1616–1626.5).
# Docs: https://github.com/muccc/gr-iridium#configuration-file

[osmosdr-source]

# No bias-T — external LNA injectors only.
# pack=1 required on this host: pack=0 (16-bit) lost 40–50% samples.
device_args='airspy=0x35AC63DC2D8E234F,pack=1'

sample_rate=6000000
center_freq=1622000000
bandwidth=6000000

# Linearity gain 0–21 (gr-iridium has no AGC)
gain=21
