# Airspy R2 on Lothar 118–137 cavity (no splitter).
# ka9q airspy real 20 MS/s: IF is negative (min_IF=-9.4 MHz, max_IF=-0.6 MHz).
# Lock LO at 138.0 → RF 128.6–137.4. Fits ACARS 129.125–131.85 and VDL2 136.1–136.975.

[global]
hardware = airspy
status = vhf-r2-status.local
data = vhf-r2.local
ttl = 0
iface = lo
verbose = 1
fft-threads = 2
# 16 ms → 50 Hz FFT bins so ACARS 12.5 kHz is an integer number of bins
blocktime = 0.016
wisdom-file = run/state/wisdom
mode-file = ../rx888/opt/share/ka9q-radio/presets.conf

[airspy]
device = airspy
description = WP-KMCO R2 VHF ACARS+VDL2
serial = 35ac63dc2d86554f
# Device advertises 20 MS/s real / 5 MS/s; 20 MS/s real is the ka9q path (10 MHz BW)
samprate = 20m
frequency = 138m0
linearity = true
gainstep = 15
bias = false

# ── VDL2: 1.05 MS/s IQ (oversample 10). Covers 136.100–136.975 inside ±500 kHz.
[VDL2]
data = vhf-vdl2.local
encoding = s16le
mode = iq
samprate = 1m05
low = -500k
high = +500k
hang-time = 0
recovery-rate = 100
agc = yes
snr-squelch = no
freq = 136m5375
buffer = 3

# ── ACARS: 17 POA channels, AM envelope, 12.5 kHz for acarsdec -m 1
[ACARS]
data = vhf-acars.local
encoding = s16le
mode = am
samprate = 12k5
low = -5k
high = +5k
snr-squelch = no
agc = yes
freq = "129m125 129m350 129m525 130m025 130m425 130m450 130m825 131m125 131m425 131m450 131m475 131m525 131m550 131m650 131m725 131m825 131m850"
